<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAI SINTO SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { 
            --main: #00f2fe; 
            --secondary: #4facfe;
            --bg-dark: #0a0f1d; 
            --card-bg: rgba(20, 27, 45, 0.7);
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --border-color: rgba(0, 242, 254, 0.2);
        }
        
        body { 
            font-family: 'Kanit', sans-serif; 
            background: radial-gradient(circle at 50% 0%, #141e33 0%, var(--bg-dark) 70%); 
            margin: 0; 
            padding: 15px; 
            color: var(--text-main); 
            min-height: 100vh;
        }
        
        .container { width: 100%; max-width: 420px; margin: 0 auto; padding-bottom: 30px; }
        
        /* Tech Premium Card - Holographic Cyber Look */
        .card-vip { 
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.15) 0%, rgba(0, 242, 254, 0.05) 100%); 
            color: #ffffff; 
            padding: 35px 25px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 2px rgba(255,255,255,0.1);
            position: relative; 
            margin-bottom: 30px; 
            text-align: left;
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .card-vip::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, var(--secondary), var(--main));
        }
        .card-label { 
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem; 
            letter-spacing: 3px; 
            font-weight: 700; 
            color: var(--main); 
            display: inline-block; 
            margin-bottom: 12px; 
        }
        .card-name { 
            font-size: 2rem; 
            font-weight: 700; 
            margin: 5px 0; 
            text-transform: uppercase; 
            background: linear-gradient(to right, #fff, #b3e5fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card-detail { 
            font-size: 0.95rem; 
            margin-top: 6px; 
            color: var(--text-muted); 
            font-weight: 300; 
            display: flex;
            align-items: center;
        }
        
        #userImg { 
            position: absolute; 
            right: 20px; 
            top: 50%;
            transform: translateY(-50%);
            width: 85px; 
            height: 85px; 
            border-radius: 18px; 
            border: 2px solid var(--main); 
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); 
            object-fit: cover; 
        }

        /* Form Layout */
        .section { 
            background: var(--card-bg); 
            border-radius: 24px; 
            padding: 25px; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }
        h3 { 
            margin: 0 0 20px 0; 
            font-size: 1.3rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            color: #fff;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }
        h3::before {
            content: '';
            display: inline-block;
            width: 4px; height: 18px;
            background: var(--main);
            margin-right: 10px;
            border-radius: 2px;
            box-shadow: 0 0 10px var(--main);
        }
        
        label { 
            font-size: 0.85rem; 
            font-weight: 600; 
            margin-top: 18px; 
            display: block; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            letter-spacing: 0.5px;
        }
        
        /* Input & Dropdown Styling - Futuristic Glass UI */
        input, textarea, select { 
            width: 100%; 
            padding: 14px 16px; 
            margin-top: 8px; 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-family: 'Kanit'; 
            font-size: 1rem; 
            background-color: rgba(10, 15, 29, 0.6);
            color: var(--text-main) !important; 
            transition: all 0.3s ease;
        }
        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        /* Custom Dropdown Arrow */
        select { 
            appearance: none; -webkit-appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300f2fe%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto;
            padding-right: 40px; cursor: pointer;
        }
        select option {
            background-color: #141e33;
            color: #fff;
        }

        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: var(--main); 
            background-color: rgba(10, 15, 29, 0.9);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }
        
        /* Neon Glow Button */
        .btn-submit { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(90deg, var(--secondary), var(--main)); 
            color: #0a0f1d; 
            border: none; 
            border-radius: 14px; 
            font-weight: 700; 
            margin-top: 25px; 
            cursor: pointer; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            transition: all 0.3s ease; 
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
        }
        .btn-submit:hover {
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.6);
        }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }
        .btn-submit:disabled { background: #3b485d; color: #697a90; box-shadow: none; }

        .h-item { 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            padding: 15px 0
