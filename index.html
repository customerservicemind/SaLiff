<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAI SINTO SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { 
            --main: #1a1a1a; 
            --main-hover: #333333;
            --bg: #f8fafc; 
            --text: #1e293b; 
            --text-light: #64748b;
            --border: #e2e8f0;
            --radius-lg: 20px;
            --radius-sm: 12px;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        body { 
            font-family: 'Kanit', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px 15px; 
            color: var(--text); 
            line-height: 1.5;
        }

        .container { 
            width: 100%; 
            max-width: 440px; 
            margin: 0 auto; 
        }
        
        /* Premium Card - Brushed Metallic Silver */
        .card-vip { 
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 25%, #94a3b8 50%, #64748b 100%); 
            color: #ffffff; 
            padding: 35px 25px; 
            border-radius: var(--radius-lg); 
            box-shadow: 0 20px 40px rgba(100, 116, 139, 0.25);
            position: relative; 
            margin-bottom: 40px; 
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.4);
            overflow: visible;
        }

        .card-vip::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.4) 0%, transparent 50%);
            border-radius: var(--radius-lg);
            pointer-events: none;
        }

        .card-label { 
            font-size: 0.85rem; 
            letter-spacing: 2px; 
            font-weight: 700; 
            color: rgba(255, 255, 255, 0.9); 
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 5px;
        }

        .card-name { 
            font-size: 2rem; 
            font-weight: 700; 
            margin: 5px 0 15px 0; 
            text-transform: uppercase; 
            color: #ffffff; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.15); 
            line-height: 1.2;
        }

        .card-detail { 
            font-size: 0.95rem; 
            margin-top: 4px; 
            color: rgba(255, 255, 255, 0.85); 
            font-weight: 400; 
            display: flex;
            align-items: center;
        }
        
        #userImg { 
            position: absolute; 
            right: 25px; 
            bottom: -25px; 
            width: 100px; 
            height: 100px; 
            border-radius: 24px; 
            border: 4px solid #ffffff; 
            background: #ffffff; 
            box-shadow: 0 12px 25px rgba(0,0,0,0.12); 
            object-fit: cover; 
        }

        /* Form Layout */
        .section { 
            background: #ffffff; 
            border-radius: var(--radius-lg); 
            padding: 30px 24px; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.02); 
            border: 1px solid rgba(0,0,0,0.03);
        }

        h3 { 
            margin: 0 0 25px 0; 
            font-size: 1.35rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            display: flex;
            align-items: center;
            color: var(--text); 
        }

        h3::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 24px;
            background: var(--main);
            border-radius: 4px;
            margin-right: 12px;
        }
        
        label { 
            font-size: 0.9rem; 
            font-weight: 500; 
            margin-top: 18px; 
            display: block; 
            color: var(--text);
        }

        label:first-of-type {
            margin-top: 0;
        }
        
        /* Input & Dropdown Styling */
        input, textarea, select { 
            width: 100%; 
            padding: 14px 16px; 
            margin-top: 8px; 
            border: 1.5px solid var(--border); 
            border-radius: var(--radius-sm); 
            box-sizing: border-box; 
            font-family: 'Kanit', sans-serif; 
            font-size: 1rem; 
            background-color: #f8fafc;
            color: var(--text) !important; 
        }
        
        /* Custom Dropdown Arrow */
        select { 
            appearance: none; 
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; 
            background-position: right 16px top 50%; 
            background-size: 12px auto;
            padding-right: 40px; 
            cursor: pointer;
        }

        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: #94a3b8; 
            background-color: #ffffff; 
            box-shadow: 0 0 0 4px rgba(148, 163, 184, 0.1);
        }
        
        .btn-submit { 
            width: 100%; 
            padding: 18px; 
            background: var(--main); 
            color: white; 
            border: none; 
            border-radius: var(--radius-sm); 
            font-weight: 700; 
            margin-top: 25px; 
            cursor: pointer; 
            font-size: 1.15rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn-submit:hover {
            background: var(--main-hover);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }

        .btn-submit:active { 
            transform: scale(0.98); 
        }

        .btn-submit:disabled { 
            background: #cbd5e1; 
            cursor: not-allowed;
            box-shadow: none;
        }

        /* History List */
        .h-item { 
            border-bottom: 1px solid var(--border); 
            padding: 16px 0; 
        }
        .h-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .h-date { 
            color: var(--text-light); 
            font-size: 0.8rem; 
            font-weight: 500;
        }
        .h-topic { 
            font-weight: 700; 
            font-size: 1.05rem; 
            margin: 6px 0; 
            color: var(--text); 
        }
        .h-note { 
            color: var(--text-light); 
            font-size: 0.95rem; 
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 6px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }

        /* Loading Animation */
        .loading { 
            position: fixed; 
            inset: 0; 
            background: rgba(255,255,255,0.9); 
            backdrop-filter: blur(5px);
            display: none; 
            flex-direction: column;
            gap: 15px;
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            font-weight: 700; 
            font-size: 1.2rem; 
            color: var(--text); 
            letter-spacing: 2px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top: 4px solid var(--main);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="loading" class="loading">
    <div class="spinner"></div>
    <div>SYNCING DATA...</div>
</div>

<div class="container">
    <!-- Premium Card - Metallic Silver -->
    <div class="card-vip">
        <div class="card-label">THAI SINTO SERVICES</div>
        <div id="dispName" class="card-name">GUEST</div>
        <div id="dispCompany" class="card-detail">Company: -</div>
        <div id="dispEmail" class="card-detail">Email: -</div>
        <img id="userImg" src="https://via.placeholder.com/110">
    </div>

    <!-- Form Section -->
    <div class="section">
        <h3>Request / แจ้งบริการ</h3>
        
        <label>Subject / หัวข้อ</label>
        <select id="subject">
            <option value="" disabled selected>-- เลือกหัวข้อบริการ --</option>
            <option value="Machine Inquiry">Machine Inquiry สนใจสอบถามข้อมูลเครื่องจักร</option>
            <option value="Preventive Maintenance (PM) Check">Preventive Maintenance (PM) Check สอบถามตรวจเช็คสภาพเครื่องจักร</option>
            <option value="Spare Parts Quotation">Spare Parts Quotation สอบถามขอใบเสนอราคา</option>
            <option value="Dry Ice Blasting Service บริการทำความสะอาด">Dry Ice Blasting Service บริการทำความสะอาด</option>
            <option value="Dust Check System บริการตรวจสอบระบบดักฝุ่น">Dust Check System บริการตรวจสอบระบบดักฝุ่น</option>
            <option value="Dust Detection App บริการตรวจจับการสะสมของฝุ่น">Dust Detection App บริการตรวจจับการสะสมของฝุ่น</option>
            <option value="Remote Monitoring System บริการติดตามสถานะเครื่องจักร">Remote Monitoring System บริการติดตามสถานะเครื่องจักร</option>
        </select>
        
        <label>Full Name / ชื่อ-นามสกุล</label>
        <input type="text" id="fullName" placeholder="Your full name">
        
        <label>Company / บริษัท</label>
        <input type="text" id="company" placeholder="Company name">

        <label>Email / อีเมล</label>
        <input type="email" id="email" placeholder="example@email.com">
        
        <label>Phone / เบอร์โทร</label>
        <input type="tel" id="phone" placeholder="0XXXXXXXXX" maxlength="10">
        
        <label>Details / รายละเอียด</label>
        <textarea id="userNote" rows="3" placeholder="Explain your request..."></textarea>
        
        <button id="btnSave" class="btn-submit" onclick="saveData()">SUBMIT REQUEST</button>
    </div>

    <!-- History Section -->
    <div class="section">
        <h3>Recent Activity / ประวัติ</h3>
        <div id="historyList">
            <p style="color: var(--text-light); text-align:center; margin: 10px 0 0 0; font-size: 0.95rem;">No recent activity</p>
        </div>
    </div>
</div>

<script>
    // Configuration
    const LIFF_ID = "2008820291-s6WNZ5xr"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3iff7y7yasoQjaUHTJbdQalY827KKVnDBmA0ZlTjBsciBlCbub7IzysXSZAiK9xYD/exec"; 

    async function main() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById("userImg").src = profile.pictureUrl;
                loadData(profile.userId);
            }
        } catch (e) { console.error("LIFF Init Error:", e); }
    }

    async function loadData(userId) {
        try {
            const res = await fetch(`${SCRIPT_URL}?userId=${userId}`);
            const data = await res.json();
            if (data.status === "found") {
                document.getElementById("dispName").innerText = data.user.fullName.toUpperCase();
                document.getElementById("dispCompany").innerText = "Company: " + data.user.company;
                document.getElementById("dispEmail").innerText = "Email: " + data.user.email;
                
                document.getElementById("fullName").value = data.user.fullName;
                document.getElementById("company").value = data.user.company;
                document.getElementById("email").value = data.user.email;
                document.getElementById("phone").value = data.user.phone;
                
                if (data.history && data.history.length > 0) {
                    document.getElementById("historyList").innerHTML = data.history.map(h => `
                        <div class="h-item">
                            <div class="h-date">${h.date}</div>
                            <div class="h-topic">${h.subject}</div>
                            <div class="h-note">${h.note || '-'}</div>
                        </div>
                    `).join('');
                }
            }
        } catch (e) { console.log("Data Load Error"); }
    }

    async function saveData() {
        const sub = document.getElementById("subject").value;
        const name = document.getElementById("fullName").value.trim();
        const comp = document.getElementById("company").value.trim();
        const email = document.getElementById("email").value.trim();
        const ph = document.getElementById("phone").value.trim();
        const note = document.getElementById("userNote").value.trim();

        // Validation
        if (!sub) return alert("กรุณาเลือก SUBJECT / หัวข้อ");
        if (!name || !email || !ph) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");
        if (ph.length < 9) return alert("กรุณาตรวจสอบเบอร์โทรศัพท์");

        document.getElementById("loading").style.display = "flex";
        document.getElementById("btnSave").disabled = true;

        try {
            const profile = await liff.getProfile();
            const payload = {
                userId: profile.userId, 
                lineName: profile.displayName,
                fullName: name, 
                company: comp || "-", 
                email: email, 
                phone: ph,
                subject: sub, 
                note: note
            };

            // Post to Google Sheets
            await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });

            // Send LINE Message
            if (liff.isInClient()) {
                const ts = new Date().toLocaleString('th-TH');
                await liff.sendMessages([{
                    "type": "text",
                    "text": `● NEW SERVICE REQUEST\n—\nSubject: ${sub}\nDetails: ${note || '-'}\n\nCustomer: ${name}\nCompany: ${comp || '-'}\nEmail: ${email}\nPhone: ${ph}\n—\n*Recorded at ${ts}*`
                }]);
            }

            alert("SUCCESSFULLY SUBMITTED!");
            location.reload();
        } catch (e) { 
            alert("Error: Connection Failed"); 
        } finally {
            document.getElementById("loading").style.background = "none";
            document.getElementById("loading").style.display = "none";
            document.getElementById("btnSave").disabled = false;
        }
    }

    window.onload = function() {
        main();
    };
</script>
</body>
</html>
