<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAI SINTO SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { 
            --main: #0052cc; 
            --main-light: #00c6ff;
            --neon-blue: #00f0ff;
            --tech-cyan: #00e5ff;
            --tech-blue: #0088ff;
            --bg: #030712; 
            --card-bg: rgba(10, 17, 32, 0.75);
            --text-light: #ffffff;
            --text-muted: #64748b;
            --text-cyber: #38bdf8;
            --input-bg: rgba(7, 11, 22, 0.8);
            --border-color: rgba(30, 41, 59, 0.7);
            --glow: drop-shadow(0 0 12px rgba(0, 240, 255, 0.4));
        }
        
        * { box-sizing: border-box; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body { 
            font-family: 'Kanit', sans-serif; 
            background: radial-gradient(circle at 50% 30%, #0b1528 0%, #020617 100%);
            margin: 0; 
            padding: 25px 15px; 
            color: var(--text-light); 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container { width: 100%; max-width: 430px; margin: 0 auto; }
        
        /* ==========================================================================
           NEW ULTRA PREMIUM TECH VIP CARD (MODERN BLUE LINE PATTERN + ANIMATED GLOW)
           ========================================================================== */
        .card-vip { 
            background: linear-gradient(135deg, #0b1e3d 0%, #051026 50%, #0c254e 100%); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            position: relative;
            padding: 28px 24px; 
            border-radius: 20px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8),
                        inset 0 1px 1px rgba(255, 255, 255, 0.15),
                        inset 0 -1px 1px rgba(0, 240, 255, 0.2),
                        0 0 30px rgba(0, 136, 255, 0.2);
            margin-bottom: 25px; 
            overflow: hidden; 
            border: 1px solid rgba(0, 240, 255, 0.4); 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ตารางสไตล์เรดาร์/ไฮเทค (Tech Grid Pattern Background) */
        .card-vip::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 16px 16px;
            opacity: 0.8;
            z-index: 1;
            pointer-events: none;
        }

        /* เส้นแสงพาดเฉียงแบบขยับแอนิเมชันเพิ่มความหรูหรา */
        .card-vip::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 300%;
            height: 300%;
            background: linear-gradient(115deg, transparent 40%, rgba(0, 240, 255, 0.03) 45%, rgba(0, 240, 255, 0.18) 50%, rgba(0, 240, 255, 0.03) 55%, transparent 60%);
            transform: rotate(0deg);
            z-index: 1;
            pointer-events: none;
            animation: shineCard 8s infinite linear;
        }

        @keyframes shineCard {
            0% { transform: translate(-30%, -30%) rotate(0deg); }
            100% { transform: translate(10%, 10%) rotate(0deg); }
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            gap: 15px;
        }

        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        /* ป้ายโลโก้สไตล์เรียบหรู คมชัด มีกรอบนีออนจางๆ */
        .card-label { 
            font-size: 0.65rem; 
            letter-spacing: 2px; 
            font-weight: 700; 
            color: var(--neon-blue); 
            display: inline-block; 
            margin-bottom: 6px;
            background: rgba(0, 240, 255, 0.07);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
            align-self: flex-start;
        }
        
        /* ชื่อสมาชิกดูล้ำสมัยและสง่างาม */
        .card-name { 
            font-size: 1.6rem; 
            font-weight: 700; 
            margin: 0; 
            text-transform: uppercase; 
            color: #ffffff; 
            letter-spacing: 0.5px;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            word-break: break-word;
        }
        
        .card-avatar-wrap {
            position: relative;
            flex-shrink: 0;
            z-index: 2;
        }
        
        /* ปรับสัดส่วนรูปโปรไฟล์ให้ลงตัว พร้อมกรอบวงแหวนแสงคู่ซ้อนมิติ */
        #userImg { 
            width: 100px; 
            height: 100px; 
            border-radius: 50%; 
            border: 2px solid var(--neon-blue);
            object-fit: cover; 
            background: #020617;
            box-shadow: 0 0 0 4px rgba(6, 11, 22, 0.8),
                        0 8px 20px rgba(0, 0, 0, 0.7),
                        0 0 15px rgba(0, 240, 255, 0.4);
        }

        /* ส่วนแสดงรายละเอียดแยกฝั่งซ้ายขวาให้เป็นสัดส่วน */
        .card-detail-group {
            z-index: 2;
            border-top: 1px dashed rgba(0, 240, 255, 0.2);
            padding-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .card-detail { 
            font-size: 0.8rem; 
            color: rgba(255, 255, 255, 0.65); 
            font-weight: 300;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }
        
        .card-detail::before {
            content: "//";
            color: var(--neon-blue);
            margin-right: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            opacity: 0.7;
        }

        .card-detail span {
            color: var(--tech-cyan);
            font-weight: 500;
            margin-left: auto; /* ดันข้อมูลรายละเอียดไปชิดขวาสุดเพื่อความสวยงามเป็นระเบียบ */
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }
        
        /* Interactive Hover */
        .card-vip:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 0px rgba(255, 255, 255, 0.2),
                        0 0 40px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }
        .card-vip:hover #userImg {
            transform: scale(1.04) rotate(3deg);
            border-color: var(--neon-blue);
            box-shadow: 0 0 0 4px rgba(6, 11, 22, 0.8), 0 0 25px rgba(0, 240, 255, 0.7);
        }

        /* ==========================================================================
           Cyberpunk Neon Sections & Forms
           ========================================================================== */
        .section { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px; 
            padding: 24px 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
            border: 1px solid var(--border-color);
        }
        
        h3 { 
            margin: 0 0 20px 0; 
            font-size: 1.1rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            color: #ffffff; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        h3::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background: linear-gradient(to bottom, var(--neon-blue), var(--main));
            margin-right: 10px;
            border-radius: 2px;
            box-shadow: 0 0 10px var(--neon-blue);
        }
        
        label { 
            font-size: 0.75rem; 
            font-weight: 500; 
            margin-top: 14px; 
            display: block; 
            text-transform: uppercase; 
            color: var(--text-cyber); 
            letter-spacing: 0.5px;
        }
        
        input, textarea, select { 
            width: 100%; 
            padding: 12px 16px; 
            margin-top: 6px; 
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            font-family: 'Kanit'; 
            font-size: 0.95rem; 
            background-color: var(--input-bg);
            color: var(--text-light) !important; 
        }
        
        input::placeholder, textarea::placeholder { color: #334155; }

        select { 
            appearance: none; 
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2338bdf8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; 
            background-position: right 16px top 50%; 
            background-size: 11px auto;
            padding-right: 40px; 
            cursor: pointer;
        }

        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: var(--neon-blue); 
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.3);
            background-color: #090f1d; 
        }
        
        .btn-submit { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(90deg, #0044bb 0%, #0088ff 50%, var(--main-light) 100%); 
            color: white; 
            border: 1px solid rgba(0, 240, 255, 0.4); 
            border-radius: 12px; 
            font-weight: 600; 
            margin-top: 20px; 
            cursor: pointer; 
            font-size: 1rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            box-shadow: 0 8px 25px rgba(0, 136, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn-submit:hover {
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6);
            border-color: var(--neon-blue);
            transform: translateY(-2px);
        }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }
        .btn-submit:disabled { background: #1e293b; box-shadow: none; border-color: transparent; color: #475569 !important; cursor: not-allowed; }

        .h-item { 
            border-bottom: 1px solid rgba(30, 41, 59, 0.6); 
            padding: 14px 0; 
        }
        .h-item:last-child { border-bottom: none; }
        .h-date { color: var(--text-muted); font-size: 0.75rem; font-weight: 400; }
        .h-topic { font-weight: 500; font-size: 0.95rem; margin: 4px 0; color: #f8fafc; }
        .h-note { color: #94a3b8; font-size: 0.85rem; font-weight: 300; background: rgba(0, 0, 0, 0.3); padding: 8px 12px; border-radius: 8px; margin-top: 6px; border-left: 2px solid var(--neon-blue); }

        .loading { 
            position: fixed; 
            inset: 0; 
            background: rgba(2, 6, 23, 0.96); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            font-weight: 600; 
            font-size: 1.1rem; 
            color: var(--neon-blue); 
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }
    </style>
</head>
<body>

<div id="loading" class="loading">SYNCING DATA...</div>

<div class="container">
    <div class="card-vip">
        <div class="card-top-row">
            <div class="card-info">
                <div class="card-label">THAI SINTO SERVICES</div>
                <div id="dispName" class="card-name">GUEST</div>
            </div>
            <div class="card-avatar-wrap">
                <img id="userImg" src="https://via.placeholder.com/100">
            </div>
        </div>
        
        <div class="card-detail-group">
            <div id="dispCompany" class="card-detail">Company: <span>-</span></div>
            <div id="dispEmail" class="card-detail">Email: <span>-</span></div>
        </div>
    </div>

    <div class="section">
        <h3>Request / แจ้งบริการ</h3>
        
        <label>Subject / หัวข้อ</label>
        <select id="subject">
            <option value="" disabled selected>-- เลือกหัวข้อบริการ --</option>
            <option value="Machine Inquiry">Machine Inquiry สนใจสอบถามข้อมูลเครื่องจักร</option>
            <option value="Preventive Maintenance (PM) Check">Preventive Maintenance (PM) Check สอบถามตรวจเช็คสภาพเครื่องจักร</option>
            <option value="Spare Parts Quotation">Spare Parts Quotation สอบถามขอใบเสนอราคา</option>
            <option value="Dry Ice Blasting Service บริการทำความสะอาด">Dry Ice Blasting Service บริการทำความสะอาด</option>
            <option value="Dust Check System บริการตรวจสอบระบบดักฝุ่น">Dust Check System บริการตรวจสอบระบบดักฝุ่น</option>
            <option value="Dust Detection App บริการตรวจจับการสะสมของฝุ่น">Dust Detection App บริการตรวจจับการสะสมของฝุ่น</option>
            <option value="Remote Monitoring System บริการติดตามสถานะเครื่องจักร">Remote Monitoring System บริการติดตามสถานะเครื่องจักร</option>
        </select>
        
        <label>Full Name / ชื่อ-นามสกุล</label>
        <input type="text" id="fullName" placeholder="Your full name">
        
        <label>Company / บริษัท</label>
        <input type="text" id="company" placeholder="Company name">

        <label>Email / อีเมล</label>
        <input type="email" id="email" placeholder="example@email.com">
        
        <label>Phone / เบอร์โทร</label>
        <input type="tel" id="phone" placeholder="0XXXXXXXXX" maxlength="10">
        
        <label>Details / รายละเอียด</label>
        <textarea id="userNote" rows="3" placeholder="Explain your request..."></textarea>
        
        <button id="btnSave" class="btn-submit" onclick="saveData()">SUBMIT REQUEST</button>
    </div>

    <div class="section">
        <h3>Recent Activity / ประวัติ</h3>
        <div id="historyList">
            <p style="color:var(--text-muted); text-align:center; font-weight: 300; font-size: 0.9rem;">No recent activity</p>
        </div>
    </div>
</div>

<script>
    const LIFF_ID = "2008820291-s6WNZ5xr"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzo7FMjAkJgs8wtXtGaQLznL47eTQ2t_0E36BIrevgII23kaNII_r-UB7VpZ6EUaLFJ/exec"; 

    async function main() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById("userImg").src = profile.pictureUrl;
                loadData(profile.userId);
            }
        } catch (e) { console.error("LIFF Init Error:", e); }
    }

    async function loadData(userId) {
        try {
            const res = await fetch(`${SCRIPT_URL}?userId=${userId}`);
            const data = await res.json();
            if (data.status === "found") {
                document.getElementById("dispName").innerText = data.user.fullName.toUpperCase();
                document.getElementById("dispCompany").innerHTML = "Company: <span>" + data.user.company + "</span>";
                document.getElementById("dispEmail").innerHTML = "Email: <span>" + data.user.email + "</span>";
                
                document.getElementById("fullName").value = data.user.fullName;
                document.getElementById("company").value = data.user.company;
                document.getElementById("email").value = data.user.email;
                document.getElementById("phone").value = data.user.phone;
                
                if (data.history && data.history.length > 0) {
                    document.getElementById("historyList").innerHTML = data.history.map(h => `
                        <div class="h-item">
                            <div class="h-date">${h.date}</div>
                            <div class="h-topic">${h.subject}</div>
                            <div class="h-note">${h.note || '-'}</div>
                        </div>
                    `).join('');
                }
            }
        } catch (e) { console.log("Data Load Error"); }
    }

    async function saveData() {
        const sub = document.getElementById("subject").value;
        const name = document.getElementById("fullName").value.trim();
        const comp = document.getElementById("company").value.trim();
        const email = document.getElementById("email").value.trim();
        const ph = document.getElementById("phone").value.trim();
        const note = document.getElementById("userNote").value.trim();

        if (!sub) return alert("กรุณาเลือก SUBJECT / หัวข้อ");
        if (!name || !email || !ph) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");
        if (ph.length < 9) return alert("กรุณาตรวจสอบเบอร์โทรศัพท์");

        document.getElementById("loading").style.display = "flex";
        document.getElementById("btnSave").disabled = true;

        try {
            const profile = await liff.getProfile();
            const payload = {
                userId: profile.userId, 
                lineName: profile.displayName,
                fullName: name, 
                company: comp || "-", 
                email: email, 
                phone: ph,
                subject: sub, 
                note: note
            };

            await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });

            if (liff.isInClient()) {
                const ts = new Date().toLocaleString('th-TH');
                await liff.sendMessages([{
                    "type": "text",
                    "text": `● NEW SERVICE REQUEST\n—\nSubject: ${sub}\nDetails: ${note || '-'}\n\nCustomer: ${name}\nCompany: ${comp || '-'}\nEmail: ${email}\nPhone: ${ph}\n—\n*Recorded at ${ts}*`
                }]);
            }

            alert("SUCCESSFULLY SUBMITTED!");
            location.reload();
        } catch (e) { 
            alert("Error: Connection Failed"); 
        } finally {
            document.getElementById("loading").style.display = "none";
            document.getElementById("btnSave").disabled = false;
        }
    }

    window.onload = function() {
        main();
    };
</script>
</body>
</html>
