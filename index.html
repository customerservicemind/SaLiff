<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAI SINTO SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { 
            --primary-neon: #00ffcc; /* เทอร์ควอยซ์นีออน */
            --secondary-neon: #0077ff; /* น้ำเงินเทค */
            --bg-dark: #0a0f1d; /* ดำลึกมิติดิจิทัล */
            --card-bg: rgba(20, 27, 45, 0.7); /* กระจกรมดำโปร่งแสง */
            --text-main: #ffffff;
            --text-muted: #8fa0c0;
        }
        
        body { 
            font-family: 'Kanit', sans-serif; 
            background: radial-gradient(circle at top right, #112240 0%, var(--bg-dark) 70%);
            margin: 0; 
            padding: 15px; 
            color: var(--text-main); 
            min-height: 100vh;
        }
        
        .container { width: 100%; max-width: 440px; margin: 0 auto; box-sizing: border-box; }
        
        /* Premium Tech Card - Glowing Metallic Hybrid */
        .card-vip { 
            background: linear-gradient(135deg, #1f293d 0%, #0d1527 100%); 
            color: #ffffff; 
            padding: 35px 25px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 255, 204, 0.08), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            position: relative; 
            margin-bottom: 35px; 
            text-align: left;
            border: 1px solid rgba(0, 255, 204, 0.2);
            overflow: hidden;
        }
        
        /* เอฟเฟกต์แสงสะท้อนบนการ์ด */
        .card-vip::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.03), transparent);
            transform: rotate(45deg);
            pointer-events: none;
        }
        
        .card-label { 
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem; 
            letter-spacing: 3px; 
            font-weight: 700; 
            color: var(--primary-neon); 
            display: inline-block; 
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        
        .card-name { 
            font-size: 2.2rem; 
            font-weight: 700; 
            margin: 5px 0; 
            text-transform: uppercase; 
            color: #ffffff; 
            letter-spacing: 1px;
        }
        
        .card-detail { 
            font-size: 1rem; 
            margin-top: 6px; 
            color: var(--text-muted); 
            font-weight: 300; 
            display: flex;
            align-items: center;
        }
        
        #userImg { 
            position: absolute; 
            right: 20px; 
            bottom: 20px; 
            width: 95px; 
            height: 95px; 
            border-radius: 18px; 
            border: 2px solid var(--primary-neon); 
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); 
            object-fit: cover; 
        }

        /* Glassmorphism Section Layout */
        .section { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px; 
            padding: 30px 25px; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        h3 { 
            margin: 0 0 25px 0; 
            font-size: 1.3rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            color: #ffffff;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }
        
        h3::before {
            content: '';
            display: inline-block;
            width: 5px; height: 22px;
            background: linear-gradient(to bottom, var(--primary-neon), var(--secondary-neon));
            margin-right: 12px;
            border-radius: 4px;
            box-shadow: 0 0 10px var(--primary-neon);
        }
        
        label { 
            font-size: 0.85rem; 
            font-weight: 500; 
            margin-top: 20px; 
            display: block; 
            text-transform: uppercase; 
            color: var(--primary-neon); 
            letter-spacing: 1.5px;
        }
        
        /* Inputs Customization */
        input, textarea, select { 
            width: 100%; 
            padding: 16px; 
            margin-top: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 14px; 
            box-sizing: border-box;
