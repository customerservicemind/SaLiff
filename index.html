<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAI SINTO SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { 
            --main: #0052cc; 
            --main-light: #00c6ff;
            --bg: #0b111e; 
            --card-bg: #1a2333;
            --text-light: #ffffff;
            --text-muted: #8fa0b5;
            --input-bg: #242f41;
            --border-color: #2e3d52;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Kanit', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px 15px; 
            color: var(--text-light); 
            display: flex;
            justify-content: center;
        }
        
        .container { width: 100%; max-width: 420px; margin: 0 auto; }
        
        /* Premium Tech Card - ปรับโฉมใหม่ หรูหรากว่าเดิม */
        .card-vip { 
            background: linear-gradient(135deg, #001533 0%, #0040aa 60%, #00c6ff 100%); 
            position: relative;
            padding: 35px 25px; 
            border-radius: 28px; 
            box-shadow: 0 25px 50px rgba(0, 198, 255, 0.2), inset 0 1px 2px rgba(255,255,255,0.25);
            margin-bottom: 30px; 
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        
        /* ลวดลาย Tech Pattern แบบจางๆ ด้านหลัง */
        .card-vip::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 45%, rgba(0, 198, 255, 0.08) 45%, rgba(0, 198, 255, 0.08) 55%, transparent 55%);
            background-size: 20px 20px;
            opacity: 0.6;
            pointer-events: none;
        }
        
        /* ฝั่งข้อมูลตัวอักษร */
        .card-info {
            flex: 1;
            padding-right: 15px;
            z-index: 2;
        }
        
        .card-label { 
            font-size: 0.8rem; 
            letter-spacing: 2.5px; 
            font-weight: 700; 
            color: #00c6ff; 
            display: inline-block; 
            margin-bottom: 20px;
            background: rgba(0, 198, 255, 0.1);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(0, 198, 255, 0.2);
            text-shadow: 0 0 10px rgba(0, 198, 255, 0.3);
        }
        
        .card-name { 
            font-size: 2.2rem; 
            font-weight: 700; 
            margin: 0 0 15px 0; 
            text-transform: uppercase; 
            color: #ffffff; 
            letter-spacing: 1px;
            line-height: 1.2;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .card-detail-group {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 12px;
        }
        
        .card-detail { 
            font-size: 0.95rem; 
            margin-bottom: 6px; 
            color: rgba(255, 255, 255, 0.85); 
            font-weight: 400; 
            letter-spacing: 0.5px;
        }
        .card-detail span {
            color: #00c6ff;
            font-weight: 500;
        }
        
        /* ปรับรูปโปรไฟล์ให้ใหญ่ขึ้น เด่นชัด และเป็นวงกลมพรีเมียม */
        .card-avatar-wrap {
            position: relative;
            z-index: 2;
            flex-shrink: 0;
        }
        
        #userImg { 
            width: 300px; 
            height: 300px; 
            border-radius: 50%; 
            border: 3px solid #ffffff; 
            box-shadow: 0 0 0 4px rgba(0, 198, 255, 0.4), 0 15px 25px rgba(0,0,0,0.4); 
            object-fit: cover; 
            transition: transform 0.3s ease;
        }
        .card-vip:hover #userImg {
            transform: scale(1.05);
        }

        /* Form & Section Layout */
        .section { 
            background: var(--card-bg); 
            border-radius: 24px; 
            padding: 30px 24px; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            border: 1px solid var(--border-color);
        }
        
        h3 { 
            margin: 0 0 25px 0; 
            font-size: 1.3rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            color: var(--text-light); 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        h3::before {
            content: "";
            display: inline-block;
            width: 5px;
            height: 20px;
            background: linear-gradient(to bottom, var(--main-light), var(--main));
            margin-right: 12px;
            border-radius: 4px;
        }
        
        label { 
            font-size: 0.85rem; 
            font-weight: 500; 
            margin-top: 20px; 
            display: block; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            letter-spacing: 0.5px;
        }
        
        /* Modern Input, Textarea, Select */
        input, textarea, select { 
            width: 100%; 
            padding: 16px; 
            margin-top: 8px; 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            font-family: 'Kanit'; 
            font-size: 1rem; 
            background-color: var(--input-bg);
            color: var(--text-light) !important; 
            transition: all 0.3s ease;
        }
        
        /* Placeholder styling */
        input::placeholder, textarea::placeholder { color: #566981; }

        /* Custom Dropdown Arrow for Dark Tech Style */
        select { 
            appearance: none; 
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238fa0b5%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; 
            background-position: right 18px top 52%; 
            background-size: 12px auto;
            padding-right: 45px; 
            cursor: pointer;
        }

        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: var(--main-light); 
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.2);
            background-color: var(--input-bg); 
        }
        
        /* Premium Glow Button */
        .btn-submit { 
            width: 100%; 
            padding: 18px; 
            background: linear-gradient(90deg, var(--main) 0%, #0073e6 50%, var(--main-light) 100%); 
            color: white; 
            border: none; 
            border-radius: 16px; 
            font-weight: 700; 
            margin-top: 30px; 
            cursor: pointer; 
            font-size: 1.2rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            transition: all 0.3s ease; 
            box-shadow: 0 8px 25px rgba(0, 82, 204, 0.4);
        }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }
        .btn-submit:disabled { background: #4a5568; box-shadow: none; cursor: not-allowed; }

        /* History List Modern Tech Style */
        .h-item { 
            border-bottom: 1px solid var(--border-color); 
            padding: 18px 0; 
        }
        .h-item:last-child { border-bottom: none; }
        .h-date { color: var(--text-muted); font-size: 0.8rem; font-weight: 300; }
        .h-topic { font-weight: 500; font-size: 1.05rem; margin: 6px 0; color: #ffffff; }
        .h-note { color: var(--text-muted); font-size: 0.95rem; font-weight: 300; background: rgba(0,0,0,0.15); padding: 8px 12px; border-radius: 8px; margin-top: 5px; }

        /* Sync Loading Overlay */
        .loading { 
            position: fixed; 
            inset: 0; 
            background: rgba(11, 17, 30, 0.95); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            font-weight: 700; 
            font-size: 1.4rem; 
            color: var(--main-light); 
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="loading" class="loading">SYNCING DATA...</div>

<div class="container">
    <div class="card-vip">
        <div class="card-info">
            <div class="card-label">THAI SINTO SERVICES</div>
            <div id="dispName" class="card-name">GUEST</div>
            <div class="card-detail-group">
                <div id="dispCompany" class="card-detail">Company: <span>-</span></div>
                <div id="dispEmail" class="card-detail">Email: <span>-</span></div>
            </div>
        </div>
        <div class="card-avatar-wrap">
            <img id="userImg" src="https://via.placeholder.com/110">
        </div>
    </div>

    <div class="section">
        <h3>Request / แจ้งบริการ</h3>
        
        <label>Subject / หัวข้อ</label>
        <select id="subject">
            <option value="" disabled selected>-- เลือกหัวข้อบริการ --</option>
            <option value="Machine Inquiry">Machine Inquiry สนใจสอบถามข้อมูลเครื่องจักร</option>
            <option value="Preventive Maintenance (PM) Check">Preventive Maintenance (PM) Check สอบถามตรวจเช็คสภาพเครื่องจักร</option>
            <option value="Spare Parts Quotation">Spare Parts Quotation สอบถามขอใบเสนอราคา</option>
            <option value="Dry Ice Blasting Service บริการทำความสะอาด">Dry Ice Blasting Service บริการทำความสะอาด</option>
            <option value="Dust Check System บริการตรวจสอบระบบดักฝุ่น">Dust Check System บริการตรวจสอบระบบดักฝุ่น</option>
            <option value="Dust Detection App บริการตรวจจับการสะสมของฝุ่น">Dust Detection App บริการตรวจจับการสะสมของฝุ่น</option>
            <option value="Remote Monitoring System บริการติดตามสถานะเครื่องจักร">Remote Monitoring System บริการติดตามสถานะเครื่องจักร</option>
        </select>
        
        <label>Full Name / ชื่อ-นามสกุล</label>
        <input type="text" id="fullName" placeholder="Your full name">
        
        <label>Company / บริษัท</label>
        <input type="text" id="company" placeholder="Company name">

        <label>Email / อีเมล</label>
        <input type="email" id="email" placeholder="example@email.com">
        
        <label>Phone / เบอร์โทร</label>
        <input type="tel" id="phone" placeholder="0XXXXXXXXX" maxlength="10">
        
        <label>Details / รายละเอียด</label>
        <textarea id="userNote" rows="3" placeholder="Explain your request..."></textarea>
        
        <button id="btnSave" class="btn-submit" onclick="saveData()">SUBMIT REQUEST</button>
    </div>

    <div class="section">
        <h3>Recent Activity / ประวัติ</h3>
        <div id="historyList">
            <p style="color:var(--text-muted); text-align:center; font-weight: 300;">No recent activity</p>
        </div>
    </div>
</div>

<script>
    // Configuration
    const LIFF_ID = "2008820291-s6WNZ5xr"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz06phlz28S7nL1MAhS8f0VZnx63kZOEu-TVmk5AY3rg1VV4uFYwilLY_j39mWsRd4c/exec"; 

    async function main() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById("userImg").src = profile.pictureUrl;
                loadData(profile.userId);
            }
        } catch (e) { console.error("LIFF Init Error:", e); }
    }

    async function loadData(userId) {
        try {
            const res = await fetch(`${SCRIPT_URL}?userId=${userId}`);
            const data = await res.json();
            if (data.status === "found") {
                document.getElementById("dispName").innerText = data.user.fullName.toUpperCase();
                document.getElementById("dispCompany").innerHTML = "Company: <span>" + data.user.company + "</span>";
                document.getElementById("dispEmail").innerHTML = "Email: <span>" + data.user.email + "</span>";
                
                document.getElementById("fullName").value = data.user.fullName;
                document.getElementById("company").value = data.user.company;
                document.getElementById("email").value = data.user.email;
                document.getElementById("phone").value = data.user.phone;
                
                if (data.history && data.history.length > 0) {
                    document.getElementById("historyList").innerHTML = data.history.map(h => `
                        <div class="h-item">
                            <div class="h-date">${h.date}</div>
                            <div class="h-topic">${h.subject}</div>
                            <div class="h-note">${h.note || '-'}</div>
                        </div>
                    `).join('');
                }
            }
        } catch (e) { console.log("Data Load Error"); }
    }

    async function saveData() {
        const sub = document.getElementById("subject").value;
        const name = document.getElementById("fullName").value.trim();
        const comp = document.getElementById("company").value.trim();
        const email = document.getElementById("email").value.trim();
        const ph = document.getElementById("phone").value.trim();
        const note = document.getElementById("userNote").value.trim();

        // Validation
        if (!sub) return alert("กรุณาเลือก SUBJECT / หัวข้อ");
        if (!name || !email || !ph) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");
        if (ph.length < 9) return alert("กรุณาตรวจสอบเบอร์โทรศัพท์");

        document.getElementById("loading").style.display = "flex";
        document.getElementById("btnSave").disabled = true;

        try {
            const profile = await liff.getProfile();
            const payload = {
                userId: profile.userId, 
                lineName: profile.displayName,
                fullName: name, 
                company: comp || "-", 
                email: email, 
                phone: ph,
                subject: sub, 
                note: note
            };

            // Post to Google Sheets
            await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });

            // Send LINE Message
            if (liff.isInClient()) {
                const ts = new Date().toLocaleString('th-TH');
                await liff.sendMessages([{
                    "type": "text",
                    "text": `● NEW SERVICE REQUEST\n—\nSubject: ${sub}\nDetails: ${note || '-'}\n\nCustomer: ${name}\nCompany: ${comp || '-'}\nEmail: ${email}\nPhone: ${ph}\n—\n*Recorded at ${ts}*`
                }]);
            }

            alert("SUCCESSFULLY SUBMITTED!");
            location.reload();
        } catch (e) { 
            alert("Error: Connection Failed"); 
        } finally {
            document.getElementById("loading").style.display = "none";
            document.getElementById("btnSave").disabled = false;
        }
    }

    window.onload = function() {
        main();
    };
</script>
</body>
</html>
