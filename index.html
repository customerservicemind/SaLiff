<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THAI SINTO SERVICES</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        :root { 
            --main-platinum: #e2e8f0; 
            --silver-light: #ffffff;
            --silver-dark: #8a9ba8;
            --chrome-glow: rgba(255, 255, 255, 0.45);
            --bg-dark: #0a0d14; 
            --card-bg: rgba(18, 22, 33, 0.75);
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --input-bg: rgba(13, 17, 28, 0.8);
            --border-color: rgba(255, 255, 255, 0.12);
            --border-silver: rgba(255, 255, 255, 0.4);
        }
        
        * { box-sizing: border-box; transition: all 0.25s ease-in-out; }
        
        body { 
            font-family: 'Kanit', sans-serif; 
            background: radial-gradient(circle at 50% 0%, #1e2530 0%, #07090e 100%);
            margin: 0; 
            padding: 25px 15px; 
            color: var(--text-light); 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container { width: 100%; max-width: 430px; margin: 0 auto; }
        
        /* ==========================================================================
           NEW LUXURY SILVER METALLIC & PLATINUM VIP CARD
           ========================================================================== */
        .card-vip { 
            /* เอฟเฟกต์สีเงินเมทัลลิกหรูหราด้วยการไล่เฉดสีโลหะ */
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 25%, #cbd5e1 50%, #94a3b8 75%, #64748b 100%); 
            position: relative;
            padding: 35px 24px; 
            border-radius: 24px; 
            
            /* มิติเงาและขอบแบบลักชัวรี่ แสงสะท้อนสีโครเมียมขาว */
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.8),
                        0 0 30px rgba(255, 255, 255, 0.1);
                        
            margin-bottom: 25px; 
            overflow: hidden; 
            border: 1px solid var(--border-silver); 
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* ลายเส้นเงาสะท้อนระดับพรีเมียม (Metallic Linear Reflection) */
        .card-vip::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(75deg, 
                transparent 15%, 
                rgba(255, 255, 255, 0.4) 20%, 
                rgba(255, 255, 255, 0.6) 23%, 
                transparent 27%,
                transparent 40%,
                rgba(255, 255, 255, 0.3) 45%,
                transparent 50%
            );
            opacity: 0.8;
            z-index: 1;
            pointer-events: none;
        }

        /* เพิ่ม Overlay พื้นผิวโลหะขัดนวล */
        .card-vip::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at top left, rgba(255, 255, 255, 0.5) 0%, transparent 80%);
            z-index: 1;
            pointer-events: none;
        }

        .card-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center; 
            z-index: 2;
            gap: 15px;
        }

        .card-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        /* ป้ายโลโก้สีดำลักชัวรี่ตัดกับตัวการ์ดสีเงิน */
        .card-label { 
            font-size: 0.7rem; 
            letter-spacing: 2px; 
            font-weight: 700; 
            color: #ffffff; 
            display: inline-block; 
            margin-bottom: 14px;
            background: #0f172a;
            padding: 5px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            align-self: flex-start;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        
        /* ชื่อสมาชิกใช้สีดาร์กชาร์โคลเงา เพื่อให้อ่านง่ายและหรูแพงบนการ์ดสีเงิน */
        .card-name { 
            font-size: 1.8rem; 
            font-weight: 700; 
            margin: 0; 
            text-transform: uppercase; 
            color: #0f172a; 
            text-align: left;
            letter-spacing: 0.5px;
            line-height: 1.2;
            word-break: break-word;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }
        
        .card-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }
        
        /* รูปโปรไฟล์ขอบทองคำขาวรมดำ */
        #userImg { 
            width: 140px; 
            height: 140px; 
            border-radius: 50%; 
            border: 3px solid #0f172a; 
            object-fit: cover; 
            background: #060b13;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* ส่วนรายละเอียดปลายการ์ด ใช้สีเข้มเพื่อความโมเดิร์นคอนทราสต์ */
        .card-detail-group {
            z-index: 2;
            border-top: 1px solid rgba(15, 23, 42, 0.15);
            padding-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .card-detail { 
            font-size: 0.85rem; 
            color: #334155; 
            font-weight: 400;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
        }
        .card-detail span {
            color: #0f172a;
            font-weight: 600;
            margin-left: 8px;
        }
        
        /* Interactive Hover */
        .card-vip:hover {
            border-color: #ffffff;
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.7), 
                        inset 0 1px 2px rgba(255, 255, 255, 1),
                        0 0 40px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .card-vip:hover #userImg {
            transform: scale(1.03);
            border-color: #1e293b;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        /* ==========================================================================
           Premium Dark Luxury Sections & Forms
           ========================================================================== */
        .section { 
            background: var(--card-bg); 
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-radius: 24px; 
            padding: 25px 20px; 
            margin-bottom: 25px; 
            box-shadow: 0 20px 45px rgba(0,0,0,0.5); 
            border: 1px solid var(--border-color);
        }
        
        h3 { 
            margin: 0 0 20px 0; 
            font-size: 1.15rem; 
            font-weight: 600; 
            text-transform: uppercase; 
            color: #ffffff; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        h3::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background: linear-gradient(to bottom, #ffffff, #94a3b8);
            margin-right: 10px;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
        
        label { 
            font-size: 0.8rem; 
            font-weight: 500; 
            margin-top: 16px; 
            display: block; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            letter-spacing: 0.5px;
        }
        
        input, textarea, select { 
            width: 100%; 
            padding: 14px 16px; 
            margin-top: 6px; 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            font-family: 'Kanit'; 
            font-size: 0.95rem; 
            background-color: var(--input-bg);
            color: var(--text-light) !important; 
        }
        
        input::placeholder, textarea::placeholder { color: #475569; }

        select { 
            appearance: none; 
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; 
            background-position: right 16px top 50%; 
            background-size: 11px auto;
            padding-right: 40px; 
            cursor: pointer;
        }

        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: rgba(255, 255, 255, 0.4); 
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
            background-color: rgba(22, 29, 43, 0.9); 
        }
        
        /* ปุ่มกดสไตล์โลหะเหลวขัดเงาเรียบหรู */
        .btn-submit { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(90deg, #64748b 0%, #cbd5e1 50%, #64748b 100%); 
            color: #0f172a; 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            border-radius: 14px; 
            font-weight: 700; 
            margin-top: 25px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.4);
        }
        .btn-submit:hover {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            border-color: #ffffff;
            background: linear-gradient(90deg, #cbd5e1 0%, #ffffff 50%, #cbd5e1 100%);
            transform: translateY(-1px);
        }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }
        .btn-submit:disabled { background: #1e293b; color: #475569; box-shadow: none; border-color: transparent; cursor: not-allowed; }

        .h-item { 
            border-bottom: 1px solid rgba(255, 255, 255, 0.06); 
            padding: 14px 0; 
        }
        .h-item:last-child { border-bottom: none; }
        .h-date { color: var(--text-muted); font-size: 0.75rem; font-weight: 300; }
        .h-topic { font-weight: 500; font-size: 0.95rem; margin: 4px 0; color: #ffffff; }
        .h-note { color: var(--text-muted); font-size: 0.85rem; font-weight: 300; background: rgba(0, 0, 0, 0.3); padding: 8px 12px; border-radius: 8px; margin-top: 4px; border-left: 2px solid #cbd5e1; }

        .loading { 
            position: fixed; 
            inset: 0; 
            background: rgba(7, 9, 14, 0.96); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 1000; 
            font-weight: 600; 
            font-size: 1.2rem; 
            color: #ffffff; 
            letter-spacing: 3px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

<div id="loading" class="loading">SYNCING DATA...</div>

<div class="container">
    <div class="card-vip">
        <div class="card-top-row">
            <div class="card-info">
                <div class="card-label">THAI SINTO SERVICES</div>
                <div id="dispName" class="card-name">GUEST</div>
            </div>
            <div class="card-avatar-wrap">
                <img id="userImg" src="https://via.placeholder.com/140">
            </div>
        </div>
        
        <div class="card-detail-group">
            <div id="dispCompany" class="card-detail">Company: <span>-</span></div>
            <div id="dispEmail" class="card-detail">Email: <span>-</span></div>
        </div>
    </div>

    <div class="section">
        <h3>Request / แจ้งบริการ</h3>
        
        <label>Subject / หัวข้อ</label>
        <select id="subject">
            <option value="" disabled selected>-- เลือกหัวข้อบริการ --</option>
            <option value="Machine Inquiry">Machine Inquiry สนใจสอบถามข้อมูลเครื่องจักร</option>
            <option value="Preventive Maintenance (PM) Check">Preventive Maintenance (PM) Check สอบถามตรวจเช็คสภาพเครื่องจักร</option>
            <option value="Spare Parts Quotation">Spare Parts Quotation สอบถามขอใบเสนอราคา</option>
            <option value="Dry Ice Blasting Service บริการทำความสะอาด">Dry Ice Blasting Service บริการทำความสะอาด</option>
            <option value="Dust Check System บริการตรวจสอบระบบดักฝุ่น">Dust Check System บริการตรวจสอบระบบดักฝุ่น</option>
            <option value="Dust Detection App บริการตรวจจับการสะสมของฝุ่น">Dust Detection App บริการตรวจจับการสะสมของฝุ่น</option>
            <option value="Remote Monitoring System บริการติดตามสถานะเครื่องจักร">Remote Monitoring System บริการติดตามสถานะเครื่องจักร</option>
        </select>
        
        <label>Full Name / ชื่อ-นามสกุล</label>
        <input type="text" id="fullName" placeholder="Your full name">
        
        <label>Company / บริษัท</label>
        <input type="text" id="company" placeholder="Company name">

        <label>Email / อีเมล</label>
        <input type="email" id="email" placeholder="example@email.com">
        
        <label>Phone / เบอร์โทร</label>
        <input type="tel" id="phone" placeholder="0XXXXXXXXX" maxlength="10">
        
        <label>Details / รายละเอียด</label>
        <textarea id="userNote" rows="3" placeholder="Explain your request..."></textarea>
        
        <button id="btnSave" class="btn-submit" onclick="saveData()">SUBMIT REQUEST</button>
    </div>

    <div class="section">
        <h3>Recent Activity / ประวัติ</h3>
        <div id="historyList">
            <p style="color:var(--text-muted); text-align:center; font-weight: 300; font-size: 0.9rem;">No recent activity</p>
        </div>
    </div>
</div>

<script>
    const LIFF_ID = "2008820291-s6WNZ5xr"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyL6hMHxNpLh6Srdm3XErGAzfH26rVC_z6ghaHPS1qA3eDmAZ7qGiRgemR1QGt6c4t2/exec"; 

    async function main() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                document.getElementById("userImg").src = profile.pictureUrl;
                loadData(profile.userId);
            }
        } catch (e) { console.error("LIFF Init Error:", e); }
    }

    async function loadData(userId) {
        try {
            const res = await fetch(`${SCRIPT_URL}?userId=${userId}`);
            const data = await res.json();
            if (data.status === "found") {
                document.getElementById("dispName").innerText = data.user.fullName.toUpperCase();
                document.getElementById("dispCompany").innerHTML = "Company: <span>" + data.user.company + "</span>";
                document.getElementById("dispEmail").innerHTML = "Email: <span>" + data.user.email + "</span>";
                
                document.getElementById("fullName").value = data.user.fullName;
                document.getElementById("company").value = data.user.company;
                document.getElementById("email").value = data.user.email;
                document.getElementById("phone").value = data.user.phone;
                
                if (data.history && data.history.length > 0) {
                    document.getElementById("historyList").innerHTML = data.history.map(h => `
                        <div class="h-item">
                            <div class="h-date">${h.date}</div>
                            <div class="h-topic">${h.subject}</div>
                            <div class="h-note">${h.note || '-'}</div>
                        </div>
                    `).join('');
                }
            }
        } catch (e) { console.log("Data Load Error"); }
    }

    async function saveData() {
        const sub = document.getElementById("subject").value;
        const name = document.getElementById("fullName").value.trim();
        const comp = document.getElementById("company").value.trim();
        const email = document.getElementById("email").value.trim();
        const ph = document.getElementById("phone").value.trim();
        const note = document.getElementById("userNote").value.trim();

        if (!sub) return alert("กรุณาเลือก SUBJECT / หัวข้อ");
        if (!name || !email || !ph) return alert("กรุณากรอกข้อมูลให้ครบถ้วน");
        if (ph.length < 9) return alert("กรุณาตรวจสอบเบอร์โทรศัพท์");

        document.getElementById("loading").style.display = "flex";
        document.getElementById("btnSave").disabled = true;

        try {
            const profile = await liff.getProfile();
            const payload = {
                userId: profile.userId, 
                lineName: profile.displayName,
                fullName: name, 
                company: comp || "-", 
                email: email, 
                phone: ph,
                subject: sub, 
                note: note
            };

            await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify(payload) });

            if (liff.isInClient()) {
                const ts = new Date().toLocaleString('th-TH');
                await liff.sendMessages([{
                    "type": "text",
                    "text": `● NEW SERVICE REQUEST\n—\nSubject: ${sub}\nDetails: ${note || '-'}\n\nCustomer: ${name}\nCompany: ${comp || '-'}\nEmail: ${email}\nPhone: ${ph}\n—\n*Recorded at ${ts}*`
                }]);
            }

            alert("SUCCESSFULLY SUBMITTED!");
            location.reload();
        } catch (e) { 
            alert("Error: Connection Failed"); 
        } finally {
            document.getElementById("loading").style.display = "none";
            document.getElementById("btnSave").disabled = false;
        }
    }

    window.onload = function() {
        main();
    };
</script>
</body>
</html>
